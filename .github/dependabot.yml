version: 2

updates:
  # ------------------------------------------------------------
  # Angular / npm frontend
  # Security updates only.
  # No PR just because a newer package version exists.
  # ------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/web/bops-ui"
    schedule:
      interval: "weekly"

    # Disable normal/version update PRs.
    # Security update PRs are still created.
    open-pull-requests-limit: 0

    # Reduce noise: group vulnerable npm dependencies together.
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ------------------------------------------------------------
  # .NET / NuGet
  # bOps has projects under src/, tests/ and samples/.
  # Security updates only.
  # ------------------------------------------------------------
  - package-ecosystem: "nuget"
    directories:
      - "/src/**"
      - "/tests/**"
      - "/samples/**"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 0

    groups:
      dotnet-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ------------------------------------------------------------
  # GitHub Actions
  # Monitor actions used by .github/workflows.
  # Security updates only.
  # ------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 0

    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
