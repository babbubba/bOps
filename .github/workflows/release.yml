name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-release-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore bOps.slnx --locked-mode

      - name: Build
        run: dotnet build bOps.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test bOps.slnx --no-build --configuration Release --filter "Category!=LiveModel"

      - name: Publish twice
        shell: pwsh
        run: |
          dotnet publish src/core/bOps.Cli/bOps.Cli.csproj --no-restore --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:ContinuousIntegrationBuild=true -p:PublishTrimmed=false --output artifacts/publish-1
          dotnet publish src/core/bOps.Cli/bOps.Cli.csproj --no-restore --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:ContinuousIntegrationBuild=true -p:PublishTrimmed=false --output artifacts/publish-2

      - name: Verify reproducibility
        shell: pwsh
        run: ./scripts/Compare-ReproducibleTrees.ps1 -FirstDirectory artifacts/publish-1 -SecondDirectory artifacts/publish-2

      - name: Pack SDK
        run: dotnet pack src/core/bOps.Abstractions/bOps.Abstractions.csproj --configuration Release --no-build --output artifacts/packages -p:ContinuousIntegrationBuild=true

      - name: Restore .NET tools
        run: dotnet tool restore

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/bops-ui/package-lock.json

      - name: UI install
        run: npm ci
        working-directory: web/bops-ui

      - name: UI build
        run: npm run build
        working-directory: web/bops-ui

      - name: Publish the API with the SPA twice (F-26)
        # The operator artifact: one self-contained bOps.Api per OS with the compiled SPA in wwwroot-ui/ (fails when the SPA is missing).
        shell: pwsh
        run: |
          ./scripts/Publish-Bops.ps1 -Runtime ${{ matrix.rid }} -SkipUiBuild -Output artifacts/api-publish-1
          ./scripts/Publish-Bops.ps1 -Runtime ${{ matrix.rid }} -SkipUiBuild -Output artifacts/api-publish-2
          ./scripts/Compare-ReproducibleTrees.ps1 -FirstDirectory artifacts/api-publish-1 -SecondDirectory artifacts/api-publish-2

      - name: Smoke test the published API artifact without Node.js (F-26)
        shell: pwsh
        run: ./scripts/Test-PublishedArtifact.ps1 -ArtifactDirectory artifacts/api-publish-1

      - name: Generate SBOM
        shell: pwsh
        run: |
          $sdkProject = [xml](Get-Content -Raw src/core/bOps.Abstractions/bOps.Abstractions.csproj)
          $version = @($sdkProject.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          ./scripts/Generate-Sbom.ps1 -Version $version

      - name: Create deterministic runtime archive and checksums
        shell: pwsh
        run: |
          ./scripts/New-ReproducibleZip.ps1 -SourceDirectory artifacts/publish-1 -DestinationFile artifacts/bops-${{ matrix.rid }}.zip
          ./scripts/New-ReproducibleZip.ps1 -SourceDirectory artifacts/api-publish-1 -DestinationFile artifacts/bops-api-${{ matrix.rid }}.zip
          $releaseFiles = @(
            Get-Item artifacts/bops-${{ matrix.rid }}.zip
            Get-Item artifacts/bops-api-${{ matrix.rid }}.zip
            Get-ChildItem artifacts/packages -File
            Get-ChildItem artifacts/sbom -File
          )
          $artifactRoot = (Resolve-Path artifacts).Path
          $releaseFiles | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [System.IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\', '/')
            "$hash *$relative" | Add-Content -LiteralPath artifacts/SHA256SUMS-${{ matrix.rid }}.txt
          }

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/bops-${{ matrix.rid }}.zip
            artifacts/bops-api-${{ matrix.rid }}.zip
            artifacts/packages/*.nupkg
            artifacts/SHA256SUMS-${{ matrix.rid }}.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: bops-${{ matrix.rid }}
          path: |
            artifacts/bops-${{ matrix.rid }}.zip
            artifacts/bops-api-${{ matrix.rid }}.zip
            artifacts/packages/*
            artifacts/sbom/*.json
            artifacts/SHA256SUMS-${{ matrix.rid }}.txt
          if-no-files-found: error
