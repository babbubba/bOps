name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Rule A1 (the core never names a package) is enforced by bOps.Architecture.Tests, not by review.
# Live-model tests (agentic/04-testing-rules.md, [Trait("Category","LiveModel")]) are excluded from
# every run here — they call a real provider, are allowed to be flaky, and must never gate a merge.
# Platform-specific tests (bOps.Packages.System.Linux.Tests, .Windows.Tests) skip themselves
# visibly on the wrong OS (LinuxOnlyFactAttribute and its Windows counterpart), so the matrix below
# needs no extra filtering to get real coverage on both OSes (agentic/00-project-spec.md, V0.5:
# "Windows + Linux parity ... CI on both OSes").
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore bOps.slnx

      - name: Build
        # TreatWarningsAsErrors is on solution-wide (Directory.Build.props) — a warning fails this
        # step exactly as it fails locally (agentic/04-testing-rules.md).
        run: dotnet build bOps.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test bOps.slnx --no-build --configuration Release --filter "Category!=LiveModel"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/bops-ui/package-lock.json

      - name: UI install
        run: npm ci
        working-directory: web/bops-ui

      - name: UI build
        run: npm run build
        working-directory: web/bops-ui

      - name: UI translation check
        # Fails when a template holds text that does not go through the translation (see web/bops-ui/README.md).
        run: npm run lint:i18n
        working-directory: web/bops-ui

      - name: UI test
        # ChromeHeadless, not the default interactive launcher — there is no display on a runner.
        run: npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: web/bops-ui

      # One repository-build SBOM is sufficient here; per-artifact SBOMs are generated by the
      # release workflow when release packaging exists. Running only on Linux avoids publishing
      # duplicate inventories from the OS matrix.
      - name: Restore .NET tools
        if: runner.os == 'Linux'
        run: dotnet tool restore

      - name: Generate SBOMs
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/Generate-Sbom.ps1

      - name: Upload SBOMs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: bops-sbom-${{ github.sha }}
          path: artifacts/sbom/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect quality platform evidence
        shell: pwsh
        env:
          QUALITY_PLATFORM: ${{ matrix.platform }}
          QUALITY_SOURCE_COMMIT: ${{ github.sha }}
          QUALITY_TRUSTED_MAIN: ${{ (matrix.platform == 'linux' && github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '0' }}
        run: |
          $active = Get-Content -Raw agentic/_quality/active-milestone.json | ConvertFrom-Json
          $output = "quality-platform-$env:QUALITY_PLATFORM.json"
          $arguments = @(
            '-CollectPlatformEvidence',
            '-Platform', $env:QUALITY_PLATFORM,
            '-Manifest', $active.manifest,
            '-SourceCommit', $env:QUALITY_SOURCE_COMMIT,
            '-Output', $output
          )
          if ($env:QUALITY_TRUSTED_MAIN -eq '1') { $arguments += '-ApplyManifestEnvironment' }
          & ./scripts/Test-MilestoneQuality.ps1 @arguments

      - name: Upload quality platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: quality-platform-${{ matrix.platform }}
          path: quality-platform-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  quality-aggregate:
    if: needs.build-and-test.result == 'success'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: quality-platform-windows
          path: ${{ runner.temp }}/quality-platform-windows

      - uses: actions/download-artifact@v4
        with:
          name: quality-platform-linux
          path: ${{ runner.temp }}/quality-platform-linux

      - name: Aggregate quality evidence
        shell: pwsh
        env:
          QUALITY_RUN_ID: ${{ github.run_id }}
          QUALITY_COMMIT: ${{ github.sha }}
        run: |
          $active = Get-Content -Raw agentic/_quality/active-milestone.json | ConvertFrom-Json
          $output = Join-Path $env:RUNNER_TEMP 'quality-ci'
          ./scripts/Test-MilestoneQuality.ps1 `
            -AggregateCiEvidence `
            -Manifest $active.manifest `
            -LocalReport $active.localReport `
            -PlatformEvidence @(
              (Join-Path $env:RUNNER_TEMP 'quality-platform-windows/quality-platform-windows.json'),
              (Join-Path $env:RUNNER_TEMP 'quality-platform-linux/quality-platform-linux.json')
            ) `
            -CiRunId $env:QUALITY_RUN_ID `
            -CiCommit $env:QUALITY_COMMIT `
            -OutputDirectory $output
          $report = Get-Content -Raw (Join-Path $output "$($active.slug).ci.json") | ConvertFrom-Json
          "## Quality aggregate" >> $env:GITHUB_STEP_SUMMARY
          "- Milestone: $($report.milestone)" >> $env:GITHUB_STEP_SUMMARY
          "- Quality status: $($report.qualityStatus)" >> $env:GITHUB_STEP_SUMMARY
          "- Final/provisional score: $($report.finalQualityScore) / $($report.provisionalScore)" >> $env:GITHUB_STEP_SUMMARY
          "- Pending platform criteria: $([string]::Join(', ', $report.pendingEvidence))" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload CI quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-ci
          path: ${{ runner.temp }}/quality-ci
          if-no-files-found: error
          retention-days: 30
