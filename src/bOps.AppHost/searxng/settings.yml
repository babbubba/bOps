# Local-development SearXNG configuration for bOps.AppHost.
# The server secret is generated at AppHost startup and injected as SEARXNG_SECRET.
use_default_settings: true

general:
  debug: false
  instance_name: "bOps development search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
