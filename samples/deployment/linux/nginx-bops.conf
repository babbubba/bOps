# /etc/nginx/conf.d/bops.conf   (F-26 sample, Mode B: Nginx terminates TLS and proxies to bOps on loopback)
#
# bOps side (bops.env):  Kestrel__Endpoints__Http__Url=http://127.0.0.1:5080
#                        BrowserSession__Origins=https://bops.example.com       <- exactly what the browser shows
#                        ReverseProxy__KnownProxies=127.0.0.1                    <- this Nginx
#
# Same origin: the browser loads the UI and calls /api on the same https://host, so no CORS is needed (and none exists).
server {
    listen 80;
    server_name bops.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bops.example.com;

    ssl_certificate     /etc/ssl/bops/fullchain.pem;
    ssl_certificate_key /etc/ssl/bops/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # TLS is terminated here, so the HSTS decision is here too.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Plugin archives are uploaded through the API (default limit 64 MiB, Plugins:Archive).
    client_max_body_size 70m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        # The browser's Host and Origin are untouched. The two headers below REPLACE whatever the client sent
        # ($remote_addr, not $proxy_add_x_forwarded_for), so a client cannot inject a forwarded address.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The task live view is a long-lived text/event-stream response: do not buffer it, do not time it out early.
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }
}
