<main class="flex min-h-screen items-center justify-center bg-bg p-6 text-text">
  <form class="w-full max-w-md rounded-xl border border-default bg-surface p-6 shadow-lg" (ngSubmit)="submit()">
    <div class="mb-5 flex items-center gap-3">
      <div class="h-11 w-11 overflow-hidden rounded-lg bg-[#0b0f19]">
        <img src="logo.png" alt="" class="h-[110px] w-[110px] -translate-y-[17px] object-cover" />
      </div>
      <div class="min-w-0 break-words">
        <h1 class="text-lg font-semibold">{{ 'login.title' | t }}</h1>
        <p class="text-sm text-muted">{{ 'login.hint' | t }}</p>
      </div>
    </div>

    @if (auth.sessionExpired()) {
      <p role="status" class="mb-4 rounded-lg border border-status-blocked bg-status-blocked/10 px-3 py-2 text-sm">
        {{ 'login.sessionExpired' | t }}
      </p>
    }

    @if (auth.unavailable()) {
      <div role="alert" class="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-risk-high bg-risk-high/10 px-3 py-2 text-sm">
        <span class="min-w-0 break-words">{{ 'login.unavailable' | t }}</span>
        <button type="button" (click)="retry()" class="shrink-0 rounded-md border border-default px-2 py-1 text-xs font-medium hover:bg-accent/5">
          {{ 'login.retry' | t }}
        </button>
      </div>
    }

    <label for="api-key" class="mb-1 block text-sm font-medium">{{ 'login.apiKey' | t }}</label>
    <input
      id="api-key"
      name="api-key"
      type="password"
      autocomplete="current-password"
      required
      [ngModel]="apiKey()"
      (ngModelChange)="apiKey.set($event)"
      class="w-full rounded-lg border border-default bg-bg px-3 py-2 outline-none focus:border-accent"
    />
    <p class="mt-2 text-xs text-muted">{{ 'login.keyNote' | t }}</p>

    <label class="mt-4 flex items-start gap-2 text-sm">
      <input
        id="keep-signed-in"
        name="keep-signed-in"
        type="checkbox"
        [ngModel]="keepSignedIn()"
        (ngModelChange)="keepSignedIn.set($event)"
        class="mt-0.5"
      />
      <span class="min-w-0 break-words">
        <span class="font-medium">{{ 'login.keepSignedIn' | t }}</span>
        <span class="mt-0.5 block text-xs text-muted">{{ 'login.keepSignedInHint' | t }}</span>
      </span>
    </label>

    @if (error(); as failure) {
      <p class="mt-3 break-words text-sm text-risk-critical">{{ failure.key | t: failure.params }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting() || !apiKey().trim()"
      class="mt-5 w-full rounded-lg bg-accent px-4 py-2 font-medium text-white disabled:opacity-50"
    >
      {{ (submitting() ? 'login.submitting' : 'login.submit') | t }}
    </button>
    <div class="mt-4 flex justify-end"><bops-language-switch /></div>
  </form>
</main>
