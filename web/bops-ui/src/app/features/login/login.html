<main class="flex min-h-screen items-center justify-center bg-bg p-6 text-text">
  <form class="w-full max-w-md rounded-xl border border-default bg-surface p-6 shadow-lg" (ngSubmit)="submit()">
    <div class="mb-5 flex items-center gap-3">
      <div class="h-11 w-11 overflow-hidden rounded-lg bg-[#0b0f19]">
        <img src="logo.png" alt="" class="h-[110px] w-[110px] -translate-y-[17px] object-cover" />
      </div>
      <div>
        <h1 class="text-lg font-semibold">{{ 'login.title' | t }}</h1>
        <p class="text-sm text-muted">{{ 'login.hint' | t }}</p>
      </div>
    </div>

    <label for="api-key" class="mb-1 block text-sm font-medium">{{ 'login.apiKey' | t }}</label>
    <input
      id="api-key"
      name="api-key"
      type="password"
      autocomplete="current-password"
      required
      [ngModel]="token()"
      (ngModelChange)="token.set($event)"
      class="w-full rounded-lg border border-default bg-bg px-3 py-2 outline-none focus:border-accent"
    />
    <p class="mt-2 text-xs text-muted">{{ 'login.keyNote' | t }}</p>

    @if (error(); as errorKey) {
      <p class="mt-3 text-sm text-risk-critical">{{ errorKey | t }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting() || !token().trim()"
      class="mt-5 w-full rounded-lg bg-accent px-4 py-2 font-medium text-white disabled:opacity-50"
    >
      {{ (submitting() ? 'login.submitting' : 'login.submit') | t }}
    </button>
    <div class="mt-4 flex justify-end"><bops-language-switch /></div>
  </form>
</main>
